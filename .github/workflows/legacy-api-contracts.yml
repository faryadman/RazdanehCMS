name: Legacy API contracts

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.402'
      - run: dotnet restore RazdanehCMS.sln
      - run: dotnet test RazdanehCMS.sln --no-restore -m:2
