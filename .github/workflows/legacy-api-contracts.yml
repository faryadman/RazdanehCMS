name: Legacy API contracts

on:
  pull_request:
  push:
    branches:
      - master
      - feature/preserve-api-contracts-cleanup

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.402'
      - run: dotnet restore RazdanehCMS.sln
      - run: dotnet test RazdanehCMS.sln --no-restore -m:2
